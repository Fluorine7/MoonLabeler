name: Tests and dependency audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "0"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Linux Qt runtime and CJK fonts
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libgl1 fonts-noto-cjk
      - name: Install current packaging tools
        run: python -m pip install --upgrade "pip>=26.2" "setuptools>=83" wheel
      - name: Install application and optional features
        run: python -m pip install ".[dev,fits,gpu,apple-gpu]"
      - name: Record the complete environment before installing the auditor
        run: python -m pip freeze --all --exclude moonlabeler > audit-requirements.txt
      - name: Install auditor
        run: python -m pip install "pip-audit>=2.10.1,<3"
      - name: Audit application, optional, transitive and packaging dependencies
        run: python -m pip_audit --disable-pip --no-deps -r audit-requirements.txt
      - name: Run tests
        run: python -m pytest -q
