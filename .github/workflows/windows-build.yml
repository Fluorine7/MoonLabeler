name: Windows portable build

# Builds the portable dist/MoonLabeler/MoonLabeler.exe with build-windows.ps1 (PyInstaller
# one-folder build with the minimal OpenCV, JPL kernels and FITS support). The zip is kept
# as a workflow artifact; pushing a v* tag also attaches it to that GitHub release.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - build-windows.ps1
      - MoonLabeler.spec
      - tools/make_icon.py
      - tools/pyinstaller-hooks/**
      - native/**
      - .github/workflows/windows-build.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      CMAKE_BUILD_PARALLEL_LEVEL: "4"
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install current packaging tools
        run: python -m pip install --upgrade "pip>=26.2" "setuptools>=83" wheel "cmake>=3.31,<5" "ninja>=1.11,<2" "numpy>=2.5.4,<3" "certifi>=2026.10.19"
      - name: Build application wheel with minimal OpenCV
        run: python -m pip wheel --no-deps --no-build-isolation -w wheelhouse .
      - name: Install the built wheel, FITS support and PyInstaller
        shell: python
        run: |
          from pathlib import Path
          import subprocess, sys
          wheel = next(Path("wheelhouse").glob("*.whl")).resolve()
          subprocess.check_call([sys.executable, "-m", "pip", "install", f"moonlabeler[fits] @ {wheel.as_uri()}", "pyinstaller>=6.22,<7"])
      - name: Verify native modules, codecs, and linked libraries
        run: python native/verify_opencv.py --output native-verification.json
      - name: Record portable packaging dependencies
        run: python -m pip freeze --all --exclude moonlabeler > portable-audit-requirements.txt
      - name: Install auditor
        run: python -m pip install "pip-audit>=2.10.1,<3"
      - name: Audit portable packaging environment
        run: python -m pip_audit --disable-pip --no-deps -r portable-audit-requirements.txt
      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text('utf-8'))['project']['version'])"
          if ($LASTEXITCODE -ne 0) { throw "Cannot read project version" }
          if ($env:GITHUB_REF -like 'refs/tags/*' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Release tag $env:GITHUB_REF_NAME does not match project version $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Reject incomplete ephemeris builds
        shell: python
        run: |
          import os, subprocess, tempfile, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text('utf-8'))['project']['version']
          with tempfile.TemporaryDirectory(dir=os.environ['RUNNER_TEMP']) as folder:
              fake = Path(folder)/'failed-download.ps1'
              fake.write_text('param([Alias("c")][string]$Code)\n'
                  'if ($Code -like "*compute_geometry*") { exit 17 }\n'
                  f'if ($Code -like "*tomllib*") {{ Write-Output "{version}"; exit 0 }}\n'
                  'if ($Code -eq "import PyInstaller, moonlabeler._opencv") { exit 0 }\n'
                  'throw "Unexpected interpreter invocation"\n', encoding='utf-8')
              result = subprocess.run(['pwsh', '-NoProfile', '-File', 'build-windows.ps1',
                  '-Python', str(fake)], capture_output=True, text=True, encoding='utf-8')
              assert result.returncode != 0, 'Packaging continued after a failed kernel download'
              assert '下載或解析 JPL 星曆' in result.stdout + result.stderr, result.stdout + result.stderr
          print('Failed kernel download stops packaging before PyInstaller')
      - name: Build portable exe and zip
        shell: pwsh
        run: pwsh -File build-windows.ps1 -Python (Get-Command python).Source
      - name: Smoke-test the exe
        shell: pwsh
        run: |
          $exe = Resolve-Path "dist\MoonLabeler\MoonLabeler.exe"
          $project = Resolve-Path "examples\demo.moonlabel"
          $process = Start-Process -FilePath $exe -ArgumentList "`"$project`"" -WorkingDirectory (Split-Path $exe) -PassThru
          try {
            Start-Sleep -Seconds 25
            if ($process.HasExited) { throw "MoonLabeler.exe exited with code $($process.ExitCode) within 25 s" }
            $cache = Join-Path $env:LOCALAPPDATA "MoonLabeler\cache\ephemeris"
            foreach ($name in @("de421.bsp", "moon_080317.tf", "pck00008.tpc", "moon_pa_de421_1900-2050.bpc")) {
              $kernel = Join-Path $cache $name
              if (-not (Test-Path $kernel -PathType Leaf) -or (Get-Item $kernel).Length -eq 0) {
                throw "bundled ephemeris was not copied completely: $kernel"
              }
            }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
          Get-ChildItem dist
      - name: Checksum
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist\*.zip | Select-Object -First 1
          (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() + "  " + $zip.Name | Set-Content -Encoding ascii "$($zip.FullName).sha256"
          Get-Content "$($zip.FullName).sha256"
      - name: Preserve portable build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: MoonLabeler-${{ steps.version.outputs.version }}-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
            native-verification.json
            portable-audit-requirements.txt
          if-no-files-found: error
          retention-days: 7

  release:
    # Attach the zip to the GitHub release of the pushed v* tag (created here if missing).
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: portable
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: MoonLabeler-${{ needs.portable.outputs.version }}-windows-x64
          path: portable
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publish all verified release assets
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          import hashlib, json, os, re, shutil, subprocess, time, tomllib
          from pathlib import Path
          repo, sha, tag = (os.environ[k] for k in ('GITHUB_REPOSITORY', 'GITHUB_SHA', 'TAG'))
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          assert tag == 'v' + version
          def gh(*args):
              return subprocess.check_output(['gh', *args], text=True)
          deadline = time.monotonic() + 40 * 60
          while time.monotonic() < deadline:
              endpoint = f'repos/{repo}/actions/workflows/checks.yml/runs?head_sha={sha}&event=push&branch=main&per_page=5'
              runs = json.loads(gh('api', endpoint))['workflow_runs']
              if runs and runs[0]['status'] == 'completed':
                  tests = runs[0]
                  assert tests['conclusion'] == 'success', f"Release tests failed: {tests['html_url']}"
                  break
              time.sleep(20)
          else:
              raise RuntimeError('Timed out waiting for three-platform tests')
          gh('run', 'download', str(tests['id']), '--repo', repo, '--pattern', 'minimal-opencv-*', '--dir', 'tested-wheels')
          assets = Path('release-assets')
          assets.mkdir()
          wheels = list(Path('tested-wheels').glob('*/*.whl'))
          assert len(wheels) == 3 and len({w.parent.name for w in wheels}) == 3
          for wheel in wheels:
              assert wheel.name.startswith(f'moonlabeler-{version}-')
              shutil.copyfile(wheel, assets/wheel.name)
              shutil.copyfile(wheel.parent/'native-verification.json', assets/f'{wheel.parent.name}-verification.json')
          name = f'MoonLabeler-{version}-windows-x64.zip'
          portable = Path('portable')
          checksum = (portable/(name+'.sha256')).read_text().strip().split()
          assert len(checksum) == 2 and checksum[1] == name and re.fullmatch('[0-9a-fA-F]{64}', checksum[0])
          expected = {name: checksum[0].lower()}
          for source, target in ((portable/name, name), (portable/(name+'.sha256'), name+'.sha256'),
                  (portable/'native-verification.json', 'portable-native-verification.json'),
                  (portable/'portable-audit-requirements.txt', 'portable-audit-requirements.txt')):
              shutil.copyfile(source, assets/target)
          for path in assets.iterdir():
              if path.name not in expected:
                  with path.open('rb') as stream:
                      expected[path.name] = hashlib.file_digest(stream, 'sha256').hexdigest()
          manifest = ''.join(f'{digest}  {name}\n' for name, digest in sorted(expected.items()))
          (assets/'SHA256SUMS').write_text(manifest, encoding='utf-8')
          expected['SHA256SUMS'] = hashlib.sha256(manifest.encode()).hexdigest()
          entry = Path('UPDATE_HISTORY.md').read_text().split(f'## {version}\n', 1)[1].split('\n## ', 1)[0].strip()
          entry = re.sub(r'\]\((?!https?://|#)([^)]+)\)', lambda m: f'](https://github.com/{repo}/blob/{tag}/{m[1]})', entry)
          intro = (f'## 下载 / Downloads\n\nWindows x64：下载 `{name}`，完整解压后运行 `MoonLabeler.exe`，保留 `_internal` 文件夹；无需安装 Python 或编译器。\n\n'
              '其余三个 wheel 分别适用于 macOS Apple Silicon、Windows x64 和 Linux x64（Ubuntu CI 构建），需要 CPython 3.12 和兼容的系统运行库；使用 `python -m pip install <文件.whl>` 安装。macOS/Linux wheel 不是独立桌面程序。\n\n')
          notes = Path('release-notes.md')
          notes.write_text(intro + entry + f'\n\nSource: `{sha}`. [Release tests]({tests["html_url"]})\n', encoding='utf-8')
          base = ['gh', 'release']
          existing = subprocess.run(base + ['view', tag, '--repo', repo, '--json', 'isDraft'], text=True, capture_output=True)
          if existing.returncode == 0:
              assert json.loads(existing.stdout)['isDraft'], 'Refusing to overwrite a published release'
          else:
              subprocess.check_call(base + ['create', tag, '--repo', repo, '--verify-tag', '--draft', '--title', f'MoonLabeler {version}', '--notes-file', str(notes)])
          subprocess.check_call(base + ['upload', tag, '--repo', repo, '--clobber'] + [str(p) for p in sorted(assets.iterdir())])
          releases = json.loads(gh('api', f'repos/{repo}/releases?per_page=100'))
          drafts = [r for r in releases if r['tag_name'] == tag and r['draft']]
          assert len(drafts) == 1, 'Expected one release draft'
          release = drafts[0]
          actual = {a['name']: a.get('digest') for a in release['assets']}
          assert actual.keys() == expected.keys(), 'Incomplete release assets'
          for name, digest in expected.items():
              assert actual[name] == 'sha256:' + digest, f'Uploaded checksum mismatch: {name}'
          subprocess.check_call(base + ['edit', tag, '--repo', repo, '--notes-file', str(notes), '--draft=false', '--latest'])
