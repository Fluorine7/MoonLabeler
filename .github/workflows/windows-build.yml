name: Windows portable build

# Builds the portable dist/MoonLabeler/MoonLabeler.exe with build-windows.ps1 (PyInstaller
# one-folder build with the minimal OpenCV, JPL kernels and FITS support). The zip is kept
# as a workflow artifact; pushing a v* tag attaches only the app ZIP to a release
# draft. Published release retries verify the existing ZIP without replacing it.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - build-windows.ps1
      - MoonLabeler.spec
      - tools/make_icon.py
      - tools/pyinstaller-hooks/**
      - moonlabeler/bundle_check.py
      - run_app.py
      - native/**
      - .github/workflows/windows-build.yml
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to publish (leave empty for a build only)"
        type: string
        default: ""
      reuse_portable_run:
        description: "Successful portable run for the tag; upload a draft or verify published assets without rebuilding"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  portable:
    if: github.event_name != 'workflow_dispatch' || inputs.reuse_portable_run == ''
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      CMAKE_BUILD_PARALLEL_LEVEL: "4"
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Prepare the patched Python 3.12.15 application runtime
        shell: pwsh
        run: |
          # setup-python's 3.12 Windows image can stop at the final upstream binary,
          # 3.12.10. Build the shipped app with the maintained standalone runtime.
          python -m pip install 'uv==0.13.4'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot install the runtime manager' }
          $env:UV_PYTHON_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'patched-python'
          uv python install 3.12.15
          if ($LASTEXITCODE -ne 0) { throw 'Cannot obtain Python 3.12.15' }
          uv venv --seed --managed-python --python 3.12.15 .venv-portable
          if ($LASTEXITCODE -ne 0) { throw 'Cannot prepare the packaging environment' }
          $scripts = (Resolve-Path '.venv-portable\Scripts').Path
          & (Join-Path $scripts 'python.exe') -c "import sys, ssl; assert sys.version_info[:3] == (3,12,15), sys.version; print(sys.version); print(ssl.OPENSSL_VERSION)"
          if ($LASTEXITCODE -ne 0) { throw 'The application runtime is below the security baseline' }
          $scripts >> $env:GITHUB_PATH
      - name: Install current packaging tools
        run: python -m pip install --upgrade "pip>=26.2" "setuptools>=83" wheel "cmake>=3.31,<5" "ninja>=1.11,<2" "numpy>=2.5.4,<3" "certifi>=2026.10.19"
      - name: Build application wheel with minimal OpenCV
        run: python -m pip wheel --no-deps --no-build-isolation -w wheelhouse .
      - name: Install the built wheel, test dependencies, FITS support and PyInstaller
        shell: python
        run: |
          from pathlib import Path
          import subprocess, sys
          wheel = next(Path("wheelhouse").glob("*.whl")).resolve()
          subprocess.check_call([sys.executable, "-m", "pip", "install", f"moonlabeler[dev,fits] @ {wheel.as_uri()}", "pyinstaller>=6.22,<7"])
      - name: Verify native modules, codecs, and linked libraries
        run: python native/verify_opencv.py --output native-verification.json
      - name: Record portable packaging dependencies
        run: python -m pip freeze --all --exclude moonlabeler > portable-audit-requirements.txt
      - name: Install auditor
        run: python -m pip install "pip-audit>=2.10.1,<3"
      - name: Audit portable packaging environment
        run: python -m pip_audit --disable-pip --no-deps -r portable-audit-requirements.txt
      - name: Run source regression tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text('utf-8'))['project']['version'])"
          if ($LASTEXITCODE -ne 0) { throw "Cannot read project version" }
          if ($env:GITHUB_REF -like 'refs/tags/*' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Release tag $env:GITHUB_REF_NAME does not match project version $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Reject incomplete ephemeris builds
        shell: python
        run: |
          import os, subprocess, tempfile, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text('utf-8'))['project']['version']
          with tempfile.TemporaryDirectory(dir=os.environ['RUNNER_TEMP']) as folder:
              fake = Path(folder)/'failed-download.ps1'
              fake.write_text('param([Alias("c")][string]$Code)\n'
                  'if ($Code -like "*compute_geometry*") { exit 17 }\n'
                  f'if ($Code -like "*tomllib*") {{ Write-Output "{version}"; exit 0 }}\n'
                  'if ($Code -eq "import PyInstaller, moonlabeler._opencv") { exit 0 }\n'
                  'throw "Unexpected interpreter invocation"\n', encoding='utf-8')
              result = subprocess.run(['pwsh', '-NoProfile', '-File', 'build-windows.ps1',
                  '-Python', str(fake)], capture_output=True, text=True, encoding='utf-8')
              assert result.returncode != 0, 'Packaging continued after a failed kernel download'
              assert '下載或解析 JPL 星曆' in result.stdout + result.stderr, result.stdout + result.stderr
          print('Failed kernel download stops packaging before PyInstaller')
      - name: Build portable exe and zip
        shell: pwsh
        run: pwsh -File build-windows.ps1 -Python (Get-Command python).Source
      - name: Test the frozen image readers, registration, crater detection and exports
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'dist\MoonLabeler\MoonLabeler.exe').Path
          $evidence = Join-Path $env:RUNNER_TEMP 'frozen-evidence'
          New-Item -ItemType Directory -Force $evidence | Out-Null
          $savedPath = $env:PATH
          try {
            $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
            $env:MOONLABELER_BUNDLE_CHECK = Join-Path $evidence 'frozen-check.json'
            $env:MOONLABELER_CACHE = Join-Path $env:RUNNER_TEMP 'frozen-cache'
            $env:MOONLABELER_COMPUTE = 'cpu'
            $env:QT_QPA_PLATFORM = 'offscreen'
            $process = Start-Process -FilePath $exe -WorkingDirectory $env:RUNNER_TEMP -PassThru
            if (-not $process.WaitForExit(120000)) {
              Stop-Process -Id $process.Id -Force
              throw 'Frozen integration check timed out'
            }
            if ($process.ExitCode -ne 0) {
              Get-Content (Join-Path $evidence 'frozen-check.json') -ErrorAction SilentlyContinue
              throw "Frozen check failed: $($process.ExitCode)"
            }
            $report = Get-Content (Join-Path $evidence 'frozen-check.json') -Raw | ConvertFrom-Json
            if (-not $report.success) { throw 'Frozen check did not report success' }
            if ($report.python -ne '3.12.15') { throw "Unpatched Python in the EXE: $($report.python)" }
            if ($report.app_version -ne '${{ steps.version.outputs.version }}') { throw "Wrong application version in the EXE: $($report.app_version)" }
            Copy-Item (Join-Path $evidence 'frozen-check.json') 'portable-frozen-verification.json'
          } finally {
            $env:PATH = $savedPath
            Remove-Item Env:MOONLABELER_BUNDLE_CHECK,Env:MOONLABELER_CACHE,Env:MOONLABELER_COMPUTE,Env:QT_QPA_PLATFORM -ErrorAction SilentlyContinue
          }
      - name: Preserve frozen-app evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-frozen-evidence
          path: ${{ runner.temp }}/frozen-evidence/
          if-no-files-found: warn
          retention-days: 7
      - name: Smoke-test the exe
        shell: pwsh
        run: |
          $exe = Resolve-Path "dist\MoonLabeler\MoonLabeler.exe"
          $project = Resolve-Path "examples\demo.moonlabel"
          $process = Start-Process -FilePath $exe -ArgumentList "`"$project`"" -WorkingDirectory (Split-Path $exe) -PassThru
          try {
            Start-Sleep -Seconds 25
            if ($process.HasExited) { throw "MoonLabeler.exe exited with code $($process.ExitCode) within 25 s" }
            $cache = Join-Path $env:LOCALAPPDATA "MoonLabeler\cache\ephemeris"
            foreach ($name in @("de421.bsp", "moon_080317.tf", "pck00008.tpc", "moon_pa_de421_1900-2050.bpc")) {
              $kernel = Join-Path $cache $name
              if (-not (Test-Path $kernel -PathType Leaf) -or (Get-Item $kernel).Length -eq 0) {
                throw "bundled ephemeris was not copied completely: $kernel"
              }
            }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
          Get-ChildItem dist
      - name: Checksum
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist\*.zip | Select-Object -First 1
          (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() + "  " + $zip.Name | Set-Content -Encoding ascii "$($zip.FullName).sha256"
          Get-Content "$($zip.FullName).sha256"
      - name: Preserve portable build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: MoonLabeler-${{ steps.version.outputs.version }}-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
            native-verification.json
            portable-audit-requirements.txt
            portable-frozen-verification.json
          if-no-files-found: error
          retention-days: 7

  release:
    # A dispatch can retry publication from verified artifacts without rebuilding.
    if: >-
      always() && !cancelled() &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.portable.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && inputs.reuse_portable_run != ''))
    needs: portable
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Validate source and portable producer
        id: source
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_RUN: ${{ inputs.reuse_portable_run || github.run_id }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          import json, os, subprocess, tomllib
          from pathlib import Path
          repo, run_id = os.environ['GITHUB_REPOSITORY'], os.environ['PRODUCER_RUN']
          assert run_id.isdigit(), 'Invalid artifact producer run ID'
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          assert os.environ['RELEASE_TAG'] == 'v' + version
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/{path}'], text=True))
          producer = api(f'actions/runs/{run_id}')
          assert producer['head_sha'] == sha, 'Artifact source differs from the release tag'
          jobs = api(f'actions/runs/{run_id}/jobs?per_page=100')['jobs']
          assert any(j['name'] == 'portable' and j['conclusion'] == 'success' for j in jobs), 'Portable build did not pass'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'version={version}\nsha={sha}\nrun_id={run_id}\n')
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: MoonLabeler-${{ steps.source.outputs.version }}-windows-x64
          path: portable
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Publish or verify the Windows app ZIP
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          import hashlib, json, os, re, subprocess, tomllib
          from pathlib import Path
          repo, sha, tag = (os.environ[k] for k in ('GITHUB_REPOSITORY', 'SOURCE_SHA', 'TAG'))
          version = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version']
          assert tag == 'v' + version
          name = f'MoonLabeler-{version}-windows-x64.zip'
          allowed = {name, f'MoonLabeler-{version}-macos-arm64.zip'}
          archive = Path('portable') / 'dist' / name
          checksum = archive.with_suffix('.zip.sha256').read_text(encoding='ascii').strip().split()
          assert len(checksum) == 2 and checksum[1] == name and re.fullmatch('[0-9a-fA-F]{64}', checksum[0])
          expected = checksum[0].lower()
          with archive.open('rb') as stream:
              assert hashlib.file_digest(stream, 'sha256').hexdigest() == expected, 'Downloaded artifact checksum mismatch'
          def gh(*args):
              return subprocess.check_output(['gh', *args], text=True)
          existing = subprocess.run(['gh', 'release', 'view', tag, '--repo', repo, '--json', 'isDraft,assets'], text=True, capture_output=True)
          if existing.returncode == 0:
              release = json.loads(existing.stdout)
              assert {a['name'] for a in release['assets']} <= allowed, 'Unexpected release attachment'
              if not release['isDraft']:
                  published = json.loads(gh('api', f'repos/{repo}/releases/tags/{tag}'))
                  assert published['tag_name'] == tag and not published['draft'], 'Release state changed'
                  assets = {a['name']: a.get('digest') for a in published['assets']}
                  assert assets.keys() == allowed, 'Published release must contain both app ZIPs only'
                  assert assets[name] == 'sha256:' + expected, 'Published Windows ZIP differs from the verified build'
                  print('Verified published Windows ZIP. Existing release assets were not modified.')
                  raise SystemExit(0)
          else:
              entry = Path('UPDATE_HISTORY.md').read_text(encoding='utf-8').split(f'## {version}\n', 1)[1].split('\n## ', 1)[0].strip()
              entry = re.sub(r'\]\((?!https?://|#)([^)]+)\)', lambda m: f'](https://github.com/{repo}/blob/{tag}/{m[1]})', entry)
              notes = Path('release-notes.md')
              notes.write_text(entry + f'\n\nSource: `{sha}`.\n', encoding='utf-8')
              gh('release', 'create', tag, '--repo', repo, '--verify-tag', '--draft', '--title', f'MoonLabeler {version}', '--notes-file', str(notes))
          gh('release', 'upload', tag, '--repo', repo, '--clobber', str(archive))
          releases = json.loads(gh('api', f'repos/{repo}/releases?per_page=100'))
          drafts = [r for r in releases if r['tag_name'] == tag and r['draft']]
          assert len(drafts) == 1, 'Expected one release draft'
          assets = {a['name']: a.get('digest') for a in drafts[0]['assets']}
          assert name in assets and assets.keys() <= allowed, 'Unexpected release attachments'
          assert assets[name] == 'sha256:' + expected, 'Uploaded checksum mismatch'
          print('Verified Windows ZIP uploaded. Release remains a draft until both apps are ready.')
